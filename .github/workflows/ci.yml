name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Hygiene and secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the secret scan covers the whole history
      - uses: astral-sh/setup-uv@v10.4.0  # setup-uv publishes no floating major tag after v7
        with:
          version: "0.13.9"
      - name: pre-commit hooks
        run: uvx pre-commit@4.7.0 run --all-files --show-diff-on-failure
        env:
          # These have their own jobs below; the gitleaks hook only scans staged changes.
          SKIP: mypy,eslint,tsc,gitleaks
      - name: Scan git history for secrets
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f git --redact --verbose /repo

  backend:
    name: Backend (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg18-trixie@sha256:ab49524d18df7200b74ac9a475e1db6297fc1eb57da4c214c63d10ecc4b754fa
        env:
          POSTGRES_USER: relay
          POSTGRES_PASSWORD: relay-ci
          POSTGRES_DB: relay
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U relay -d relay"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:8.10.3-alpine@sha256:7958cfbb9d152f87dadfbc89f1b0b15938f0b81ff8982feb327476f4911935c3
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://relay:relay-ci@localhost:5432/relay
      REDIS_URL: redis://localhost:6379/0
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0  # setup-uv publishes no floating major tag after v7
        with:
          version: "0.13.9"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
      - name: Known vulnerabilities in the locked dependencies
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt \
            | uvx pip-audit@2.10.1 --strict --disable-pip --no-deps -r /dev/stdin
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - name: pytest (unit, integration, MCP, agent, evals) with the domain coverage gate
        run: uv run pytest --cov=relay.domain --cov-report=term --cov-fail-under=90
      - name: Eval harness self-tests (no model calls)
        run: uv run relay eval selftest

  eval-gate:
    # PLAN.md §9.9: the CI subset against the live API, once per scenario, with retries for
    # failures, compared with evals/baseline.json. It costs a few dollars per run, so it needs the
    # ANTHROPIC_API_KEY repository secret; pull requests from forks get no secrets and skip it.
    name: Eval gate (CI subset, live)
    runs-on: ubuntu-latest
    needs: backend
    timeout-minutes: 45
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg18-trixie@sha256:ab49524d18df7200b74ac9a475e1db6297fc1eb57da4c214c63d10ecc4b754fa
        env:
          POSTGRES_USER: relay
          POSTGRES_PASSWORD: relay-ci
          POSTGRES_DB: relay
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U relay -d relay"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://relay:relay-ci@localhost:5432/relay
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.fastembed
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Skip without an API key
        id: key
        working-directory: .
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::notice title=Eval gate skipped::No ANTHROPIC_API_KEY secret (a fork, or not configured). The deterministic tests still ran."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.key.outputs.skip != 'true'
        uses: actions/checkout@v7
      - if: steps.key.outputs.skip != 'true'
        uses: astral-sh/setup-uv@v10.4.0  # setup-uv publishes no floating major tag after v7
        with:
          version: "0.13.9"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - if: steps.key.outputs.skip != 'true'
        uses: actions/cache@v6
        with:
          path: .fastembed
          key: fastembed-bge-small-en-v1.5
      - if: steps.key.outputs.skip != 'true'
        run: uv sync --locked
      - if: steps.key.outputs.skip != 'true'
        name: The CI subset against the baseline (writes the job summary)
        run: uv run relay eval gate --yes
      - if: always() && steps.key.outputs.skip != 'true'
        name: Eval report
        uses: actions/upload-artifact@v7
        with:
          name: eval-gate-report
          path: |
            evals/reports/*/report.md
            evals/reports/*/report.json
          retention-days: 30

  frontend:
    name: Frontend (ESLint, tsc, build)
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Known vulnerabilities in the production dependencies
        run: npm audit --omit=dev --audit-level=high
      - uses: astral-sh/setup-uv@v10.4.0  # the backend writes the OpenAPI document
        with:
          version: "0.13.9"
      - name: The typed API client matches the backend (regenerate with make api-types)
        run: |
          (cd ../backend && uv run relay api openapi) > lib/api/openapi.json
          npx --yes openapi-typescript@7.13.0 lib/api/openapi.json -o lib/api/schema.d.ts
          git diff --exit-code -- lib/api
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  stack:
    name: Docker images and compose stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cp .env.example .env
      - name: The production compose file is valid with every required value set
        run: |
          sed 's/=$/=ci-placeholder/' deploy/env.prod.example > "$RUNNER_TEMP/prod.env"
          docker compose --env-file "$RUNNER_TEMP/prod.env" -f compose.prod.yaml config --quiet
      - run: docker compose build
      - name: Images run as a non-root user
        run: |
          for image in relay-backend relay-web; do
            uid=$(docker run --rm "$image" id -u)
            echo "$image runs as uid $uid"
            test "$uid" != "0"
          done
      - run: docker compose up --detach --wait
      - name: Smoke test through Caddy
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8080/api/readyz
          curl --fail --silent --show-error http://127.0.0.1:8080/healthz
      - name: Seed on the eval clock and verify (embeddings run on the baked-in model)
        run: |
          docker compose run --rm -T migrate relay seed --now 2026-09-15T15:00:00-04:00
          docker compose run --rm -T migrate relay seed --verify
      - name: MCP over HTTP needs a turn token and acts only for its customer
        run: |
          call() { docker compose exec -T mcp relay mcp call "$@" --as dana.whitfield@example.com 2>&1; }
          call get_customer | grep -q '"full_name": "Dana Whitfield"'
          # PV-800201 belongs to another persona, so Dana's token must not reveal it.
          if out=$(call get_order '{"order_number": "PV-800201"}'); then
            echo "expected ORDER_NOT_FOUND, got: $out"; exit 1
          fi
          grep -q '^\[ORDER_NOT_FOUND\]' <<< "$out"
          docker compose exec -T mcp python -c "
          import urllib.error, urllib.request
          request = urllib.request.Request('http://127.0.0.1:8001/mcp', data=b'{}', method='POST')
          try:
              urllib.request.urlopen(request, timeout=5)
          except urllib.error.HTTPError as error:
              raise SystemExit(0 if error.code == 401 else f'expected 401, got {error.code}')
          raise SystemExit('expected 401 without a token')
          "
      - name: The API signs in a demo persona and keeps customers out of the console
        run: |
          jar=$(mktemp)
          api() { curl --silent --show-error -b "$jar" -c "$jar" -H 'Origin: http://localhost:8080' -H 'Content-Type: application/json' "$@"; }
          api --fail -X POST http://127.0.0.1:8080/api/auth/demo -d '{"persona": "dana"}' | grep -q '"name":"Dana Whitfield"'
          test "$(api -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/console/approvals)" = 403
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/console/approvals)" = 401
      - name: Browser smoke test (Playwright, on the key-free scripted agent)
        run: |
          RELAY_PROVIDER=scripted RELAY_LOGINS_PER_MINUTE=120 docker compose up --detach --wait api
          # npm ci runs in the Playwright image too: its Node satisfies the frontend's engines.
          docker run --rm --network host --ipc=host --user "$(id -u):$(id -g)" -e HOME=/tmp -e CI=1 \
            -v "$PWD/frontend:/work" -w /work mcr.microsoft.com/playwright:v1.65.1-noble@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579 \
            sh -c "npm ci --no-audit --no-fund && npx playwright test"
      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
      - name: Service status and logs
        if: failure()
        run: docker compose ps && docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down --volumes
