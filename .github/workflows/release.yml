name: Release

# Pushing a tag such as v1.0.0 builds the two production images and pushes them to GHCR:
#   ghcr.io/<owner>/relay-backend:<tag>  (the API, the MCP server and the relay CLI)
#   ghcr.io/<owner>/relay-web:<tag>      (the Next.js app)
# deploy/deploy.sh then pulls that tag on the server (docs/DEPLOY.md).

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    name: Build and push ${{ matrix.image }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: relay-backend
            context: backend
          - image: relay-web
            context: frontend
    steps:
      - uses: actions/checkout@v7
      - name: Image name (GHCR needs a lowercase owner)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image }}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,format=short
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - name: The image runs as a non-root user
        run: |
          version="${GITHUB_REF_NAME#v}"
          uid=$(docker run --rm "$IMAGE:$version" id -u)
          echo "$IMAGE:$version runs as uid $uid"
          test "$uid" != "0"
