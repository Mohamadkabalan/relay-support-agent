[project]
name = "relay"
version = "0.1.0"
description = "Relay: a customer-support agent for a fictional electronics store, with an MCP tool server, human approvals and evals."
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic>=1.20.1",
    "anthropic>=2.14.0",
    "asyncpg>=0.32",
    "faker>=40.63",
    "fastapi>=0.165",
    "fastembed>=0.9.1",
    "httpx2>=2.16.2",
    "mcp>=2.3,<3",
    "openai>=3.60.0",
    "pgvector>=0.5.1",
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
    "pyjwt>=2.15.1",
    "pyyaml>=6.0.4",
    "redis>=8.1",
    "sqlalchemy[asyncio]>=2.1.9",
    "typer>=0.29",
    "uvicorn[standard]>=0.54",
]

[project.scripts]
relay = "relay.cli:app"

[dependency-groups]
dev = [
    "hypothesis>=6.170",
    "mypy>=2.4",
    "pytest>=9.2",
    "pytest-asyncio>=1.5",
    "pytest-cov>=7.1",
    "ruff>=0.17.6",
    "types-pyyaml>=6.0.12.20261122",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.alembic]
# For `uv run alembic revision --autogenerate` during development; `relay db` sets this itself.
script_location = "relay.db:migrations"

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F",  # pycodestyle, pyflakes
    "I",            # import order
    "N",            # naming
    "UP",           # modern syntax
    "B",            # bugbear
    "C4",           # comprehensions
    "SIM",          # simplifications
    "RET",          # returns
    "PTH",          # pathlib
    "ASYNC",        # async pitfalls
    "S",            # security (bandit)
    "PT",           # pytest style
    "T20",          # no print()
    "RUF",          # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # assert is how pytest works; secrets there are fakes
"src/relay/db/migrations/versions/*" = ["E501"]  # generated DDL, reviewed but not rewrapped
"src/relay/seed/**" = ["S311"]  # seeded pseudo-randomness is the point: same seed, same data
# The eval harness reads and writes small local files (results, transcripts) from async code; a
# few milliseconds of blocking don't matter next to minute-long trials.
"src/relay/evals/**" = ["ASYNC240"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
pythonpath = ["."]  # so tests can import tests.support
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]
