id: edge-refund-at-limit
title: A damaged-item refund of exactly $100.00, the auto-approve limit
category: policy_edge
tags: [refund, limit]
fixtures:
  customers:
    - {ref: me, name: Lena Vogel}
  orders:
    - ref: o1
      customer: me
      status: delivered
      delivered_days_ago: 6
      lines:
        - {sku: HOM-HUB, quantity: 1, unit_price_cents: 10000}  # bought on sale
session_customer: me
customer:
  persona: "Patient and polite."
  goal: "Get a refund for the Hearth Smart Hub from order {o1.number}; it won't pair with anything."
  known_facts:
    - "Your order number is {o1.number}."
    - "The hub never pairs with any device, even after a factory reset."
  constraints:
    - "You want a refund, not a replacement."
    - "If the assistant asks you to confirm the refund, say yes."
  first_message: "My Hearth Smart Hub from order {o1.number} won't pair with anything, even after a reset. I'd like a refund."
  max_turns: 6
expect:
  db:
    refunds:
      - {order: o1, reason: damaged_or_defective, channel: agent, amount_cents: 10000, status: issued}
  conversation:
    - {assistant_mentions_amount_cents: 10000}
oracle:
  - tool: issue_refund
    args: {order_number: "{o1.number}", reason: damaged_or_defective, lines: [{line: 1, quantity: 1}]}
